name: Weekly Subscriber Report

on:
  schedule:
    # 02:00 UTC every Monday = 09:00 Bangkok time every Monday. Adjust as you like.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write   # needed so the job can commit the updated state.json back

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run subscriber report
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_URL: ${{ secrets.FACEBOOK_PAGE_URL }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ID: ${{ secrets.X_USER_ID }}
          TIKTOK_MANUAL_COUNT: ${{ secrets.TIKTOK_MANUAL_COUNT }}
          WHATCHIMP_API_KEY: ${{ secrets.WHATCHIMP_API_KEY }}
          WHATCHIMP_API_BASE_URL: ${{ secrets.WHATCHIMP_API_BASE_URL }}
          TELEGRAM_SOURCE_BOT_TOKEN: ${{ secrets.TELEGRAM_SOURCE_BOT_TOKEN }}
          TELEGRAM_SOURCE_CHAT_ID: ${{ secrets.TELEGRAM_SOURCE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
        run: python subscriber_report.py

      - name: Commit updated state.json
        run: |
          git config user.name "subscriber-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update subscriber state [skip ci]"
          git push
